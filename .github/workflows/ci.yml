name: CI

on:
  push:
    branches: [main, AWS-update]
  pull_request:
    branches: [main, AWS-update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks and ARM64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint, typecheck, test and build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build EC2-compatible image
        run: docker build --pull --platform linux/arm64 --tag ai-dev-dashboard:ci .

      - name: Check image architecture and runtime user
        run: |
          test "$(docker image inspect ai-dev-dashboard:ci --format '{{.Architecture}}')" = arm64
          test "$(docker run --rm --network none --entrypoint id ai-dev-dashboard:ci -u)" = 1000
